name: Sync koncerter, nyheder og tekster fra Google

# Trigges on-demand via GitHub's API (fra Cloudflare Worker'en, som
# "opdater"-linket i Google Sheet/Doc peger på) — ingen tidsplan/polling.
# Kan også køres manuelt fra GitHub -> Actions-fanen -> "Run workflow".
#
# Filnavnet (sync-events.yml) er bevidst IKKE ændret til noget mere
# generelt, selvom workflowet nu også synkroniserer nyheder — Cloudflare
# Worker'en (cloudflare-worker/trigger-sync.js) refererer til filnavnet
# direkte, og en omdøbning ville kræve en ny manuel redeploy af Workeren.
on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Sæt Python op
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installér afhængigheder
        run: pip install -r scripts/requirements.txt

      - name: Kør koncert-sync
        env:
          GOOGLE_SHEET_CSV_URL: ${{ secrets.GOOGLE_SHEET_CSV_URL }}
        run: python scripts/sync_events.py

      - name: Kør nyheds-sync
        env:
          GOOGLE_DOC_HTML_URL: ${{ secrets.GOOGLE_DOC_HTML_URL }}
        run: python scripts/sync_news.py

      - name: Kør tekster-sync
        env:
          GOOGLE_TEXTS_DOC_HTML_URL: ${{ secrets.GOOGLE_TEXTS_DOC_HTML_URL }}
        run: python scripts/sync_texts.py

      - name: Commit og push, hvis data/billeder er ændret
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          # sync_news.py/sync_texts.py opretter kun disse mapper når der rent
          # faktisk er billeder — mkdir sikrer at 'git add' ikke fejler (bash -e)
          # på en manglende sti, før Lars har tilføjet sit første billede/tekst.
          mkdir -p images/nyheder images/tekster
          git add events.json news.json texts.json images/nyheder images/tekster
          git diff --cached --quiet || git commit -m "Auto-opdater koncerter/nyheder/tekster fra Google"
          git push
